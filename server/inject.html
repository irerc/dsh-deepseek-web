<script>
/*
 * 注入到登录代理页面的脚本（独立文件，避免在模板字符串里写正则时反斜杠被吃掉）。
 * 回传地址固定为同源的 /__dsweb/report，由代理转发给插件（避免跨域预检失败）；__DSW_REGION__ 线路标签。
 * 目标：用户在这个页面里怎么登录都行（密码 / 验证码 / 已登录状态），
 *       脚本把 token 从「网络层 → localStorage → Cookie → IndexedDB」四个来源里捞出来回传。
 */
(function () {
  var REPORT = '/__dsweb/report';
  var REGION = '__DSW_REGION__';
  var sent = {};   // token -> true 表示已经成功保存
  var tries = {};  // token -> 尝试次数，避免同一个失效 token 反复重试
  var TOKEN_RE = /^[A-Za-z0-9+/=_-]{30,300}$/;
  var loginEmail = ''; // 用户在登录表单里填的完整邮箱（站点接口只回脱敏地址，这个更准）
  // 用户在登录表单里填的密码：登录成功时一并回传，插件加密存在本机（下次自动填表 / 自动重登用）
  var loginPassword = '';

  // 内嵌模式：设置页把登录页放在 iframe 里（独立端口 = 独立 origin）。登录成功要通知父页面
  // 关闭窗口并刷新账号列表——父子不同源，只能靠 postMessage，父页面会校验 origin。
  var IN_FRAME = (function () { try { return window.top !== window.self; } catch (e) { return true; } })();
  // 指定账号登录：插件打开登录页时会带 __dsweb_acct=<账号 id>，
  // 这样登录成功后回传的 token 会原地替换这个账号，而不是在账号池里多出一个重复账号。
  (function () {
    try {
      var m = /[?&]__dsweb_acct=([A-Za-z0-9_-]{4,40})/i.exec(location.search || '');
      if (m) window.__dswebAccountId = m[1];
    } catch (e) {}
  })();
  function notifyParent(kind, extra) {
    if (!IN_FRAME) return;
    try {
      var msg = { type: 'dsweb:' + kind, at: Date.now() };
      if (extra) { for (var k in extra) { if (Object.prototype.hasOwnProperty.call(extra, k)) msg[k] = extra[k]; } }
      window.parent.postMessage(msg, '*');
    } catch (e) {}
  }

  function looksToken(v) {
    return typeof v === 'string' && TOKEN_RE.test(v) && v.length >= 30;
  }
  function rememberEmail(v) {
    if (typeof v !== 'string') return;
    var e = v.trim();
    if (!e || e.length > 200 || e.indexOf('@') < 0 || e.indexOf('*') >= 0) return;
    loginEmail = e;
  }
  function rememberPassword(v) {
    if (typeof v !== 'string') return;
    if (v.length < 6 || v.length > 200) return;
    loginPassword = v;
  }
  // 站点有时用自定义组件而不触发 submit，所以提交/点登录时也直接从输入框抄一份
  function captureDomCredentials() {
    try {
      var pw = document.querySelector('input[type=password]');
      if (pw && pw.value) rememberPassword(pw.value);
      var em = document.querySelector('input[type=email]');
      if (em && em.value) rememberEmail(em.value);
    } catch (e) {}
  }
  try {
    document.addEventListener('submit', captureDomCredentials, true);
    document.addEventListener('click', function (e) {
      var el = e.target;
      while (el && el !== document) {
        var t = String(el.textContent || '').trim();
        if (t && t.length <= 12 && /^(登录|登 录|立即登录|Log ?in|Sign ?in)$/i.test(t)) { captureDomCredentials(); break; }
        el = el.parentNode;
      }
    }, true);
  } catch (e) {}

  // 兜底：登录表单里的邮箱输入框
  function domEmail() {
    try {
      var el = document.querySelector('input[type=email]');
      if (el && el.value) { rememberEmail(el.value); return loginEmail; }
    } catch (e) {}
    return '';
  }

  function sidCookie() {
    var m = /(?:^|;\s*)dsweb_sid=([^;]+)/.exec(document.cookie || '');
    return m ? m[1] : '';
  }

  function pageCookieText() {
    try {
      return String(document.cookie || '')
        .split(';')
        .map(function (x) { return x.trim(); })
        .filter(function (x) { return x && x.indexOf('dsweb_sid=') !== 0; })
        .join('; ');
    } catch (e) { return ''; }
  }

  function report(token, source) {
    if (!looksToken(token) || sent[token]) return;
    if ((tries[token] || 0) >= 3) return;
    tries[token] = (tries[token] || 0) + 1;
    tip('捕获到 token（' + source + '），正在保存…');
    fetch(REPORT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        token: token,
        label: '浏览器登录',
        sid: sidCookie(),
        source: source,
        email: loginEmail || domEmail(),
        password: loginPassword || '',
        accountId: window.__dswebAccountId || '',
        // 兜底：把页面自己的 cookie 一起带回去。服务端读 cookie 罐（按 sid 找 jar 文件）偶尔会读不到
        // ——电脑端全新安装后「登录成功但没有 cookie」就是这个原因；页面里的 cookie 一定是准的。
        cookieText: pageCookieText()
      })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok) {
        tip('已保存到 DSH 插件 ✓（来源 ' + source + '），可以关闭本页了' + (loginPassword ? '；账号密码也已加密保存在本机，下次自动填写' : ''));
        // 内嵌窗口里：告诉设置页「登录成功」，它会自动关闭 iframe 并刷新账号列表
        notifyParent('login-ok', {
          accountId: (d.account && d.account.id) || window.__dswebAccountId || '',
          email: loginEmail || domEmail(),
          credentialSaved: Boolean(d && d.credentialSaved),
          source: source
        });
        var btn = document.getElementById('__dsweb_scan');
        if (btn) { btn.textContent = '已保存 ✓'; btn.disabled = true; }
        setTimeout(function () { if (location.pathname !== '/') location.href = '/'; }, 1200);
      } else {
        // 服务端明确拒绝（token 失效/格式不对）：这个 token 不再重试，换个来源继续找
        sent[token] = true;
        tip('这个 token 已被服务端拒绝：' + ((d && d.message) || JSON.stringify(d)));
      }
    }).catch(function (e) {
      tip('回传失败：' + (e && e.message ? e.message : e));
    });
  }

  /* ---------- 1. 网络层：请求头 / 登录响应 ---------- */
  // 设备身份：和密码登录、引擎请求共用同一个 UUID（由代理在 <head> 里注入）。
  // 站点用 x-device-id 认设备；不统一的话同一个账号会被当成多台设备登录，容易被风控踢下线。
  var DEVICE_ID = '__DSW_DEVICE_ID__';
  function deviceHeadersInit(init) {
    try {
      if (!DEVICE_ID || DEVICE_ID.charAt(0) === '_') return init || {};
      var out = init ? Object.assign({}, init) : {};
      var h = out.headers;
      var plain = {};
      if (h && typeof h.forEach === 'function') {
        h.forEach(function (v, k) { plain[String(k)] = v; });
      } else if (Array.isArray(h)) {
        for (var i = 0; i < h.length; i++) plain[String(h[i][0])] = h[i][1];
      } else if (h) {
        for (var k in h) plain[String(k)] = h[k];
      }
      var hasDevice = false;
      for (var key in plain) { if (String(key).toLowerCase() === 'x-device-id') hasDevice = true; }
      if (!hasDevice) plain['x-device-id'] = DEVICE_ID;
      plain['x-device-model'] = '';
      out.headers = plain;
      return out;
    } catch (e) {
      return init || {};
    }
  }
  var _fetch = window.fetch;
  if (_fetch) {
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : ((input && input.url) || '');
      var slow = setTimeout(function () { tip('请求超时 15s 仍未返回：' + url); }, 15000);
      try {
        if (/\/api\/v0\/users\//.test(url) && init && typeof init.body === 'string' && init.body.charAt(0) === '{') {
          var loginBody = JSON.parse(init.body);
          rememberEmail(loginBody.email);
          if (loginBody.password) rememberPassword(loginBody.password);
        }
      } catch (e) {}
      try {
        var h = (init && init.headers) || (input && input.headers) || null;
        if (h) {
          var auth = '';
          if (typeof h.get === 'function') auth = h.get('authorization') || '';
          else if (Array.isArray(h)) { for (var i = 0; i < h.length; i++) { if (String(h[i][0]).toLowerCase() === 'authorization') auth = h[i][1]; } }
          else { for (var k in h) { if (String(k).toLowerCase() === 'authorization') auth = h[k]; } }
          var m = /Bearer\s+([A-Za-z0-9+/=_-]{20,})/.exec(String(auth || ''));
          if (m) report(m[1], '请求头');
        }
      } catch (e) {}
      return _fetch.call(this, input, deviceHeadersInit(init)).then(function (r) {
        clearTimeout(slow);
        if (!r.ok) tip('API ' + r.status + ' ' + url);
        try {
          if (/\/api\/v0\/users\//.test(url)) {
            r.clone().text().then(function (t) {
              var mm = /"token"\s*:\s*"([A-Za-z0-9+/=_-]{20,})"/.exec(String(t || ''));
              if (mm) report(mm[1], '登录响应');
              // 把上游真实原因摊开，方便判断是风控、验证码过期还是字段问题
              if (t && (t.indexOf('"code":0') < 0 || /"biz_code":[1-9]/.test(t))) {
                tip('服务端返回（' + url.split('?')[0] + '）：' + String(t).slice(0, 300));
              }
            }, function () {});
          }
        } catch (e) {}
        return r;
      }, function (e) {
        clearTimeout(slow);
        tip('网络失败 ' + url + ' · ' + (e && e.message ? e.message : e));
        throw e;
      });
    };
  }

  var _open = XMLHttpRequest.prototype.open;
  var _send = XMLHttpRequest.prototype.send;
  var _setHeader = XMLHttpRequest.prototype.setRequestHeader;
  XMLHttpRequest.prototype.open = function (m, u) { this.__u = u; return _open.apply(this, arguments); };
  XMLHttpRequest.prototype.setRequestHeader = function (k, v) {
    try {
      if (String(k).toLowerCase() === 'x-device-id') this.__dswebHasDevice = 1;
      if (String(k).toLowerCase() === 'authorization') {
        var mm = /Bearer\s+([A-Za-z0-9+/=_-]{20,})/.exec(String(v || ''));
        if (mm) report(mm[1], '请求头');
      }
    } catch (e) {}
    return _setHeader.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function (body) {
    var xhr = this;
    try {
      if (DEVICE_ID && DEVICE_ID.charAt(0) !== '_' && !xhr.__dswebHasDevice) {
        _setHeader.call(xhr, 'x-device-id', DEVICE_ID);
        _setHeader.call(xhr, 'x-device-model', '');
      }
    } catch (e) {}
    try {
      if (/\/api\/v0\/users\//.test(xhr.__u || '') && typeof body === 'string' && body.charAt(0) === '{') {
        var xhrBody = JSON.parse(body);
        rememberEmail(xhrBody.email);
        if (xhrBody.password) rememberPassword(xhrBody.password);
      }
    } catch (e) {}
    xhr.addEventListener('loadend', function () {
      if (xhr.status === 0 || xhr.status >= 400) tip('XHR ' + xhr.status + ' ' + xhr.__u);
      try {
        var t = xhr.responseText || '';
        if (/\/api\/v0\/users\//.test(xhr.__u || '')) {
          var mm = /"token"\s*:\s*"([A-Za-z0-9+/=_-]{20,})"/.exec(t);
          if (mm) report(mm[1], '登录响应');
        }
      } catch (e) {}
    });
    return _send.apply(this, arguments);
  };

  /* ---------- 2. localStorage / Cookie ---------- */
  function tokenFromValue(v) {
    if (!v) return '';
    if (typeof v === 'string' && v.length > 2 && v.charAt(0) !== '{' && v.charAt(0) !== '[') {
      return looksToken(v) ? v : '';
    }
    try {
      var o = JSON.parse(v);
      if (o && typeof o === 'object') {
        if (looksToken(o.value)) return o.value;
        if (looksToken(o.token)) return o.token;
        if (o.value && typeof o.value === 'object' && looksToken(o.value.token)) return o.value.token;
      }
    } catch (e) {}
    return '';
  }
  function scanStorage() {
    var found = '';
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i) || '';
        var t = tokenFromValue(localStorage.getItem(k));
        if (t) { report(t, 'localStorage');
          if (!found) found = t; }
      }
    } catch (e) {}
    try {
      var parts = (document.cookie || '').split(';');
      for (var j = 0; j < parts.length; j++) {
        var eq = parts[j].indexOf('=');
        if (eq < 0) continue;
        var name = parts[j].slice(0, eq).trim();
        var val = decodeURIComponent(parts[j].slice(eq + 1).trim());
        if (looksToken(val) && /token|auth|session/i.test(name)) {
          report(val, 'cookie:' + name);
          if (!found) found = val;
        }
      }
    } catch (e) {}
    return found;
  }

  /* ---------- 3. IndexedDB（站点新版可能把登录态搬到这里） ---------- */
  function deepScan(node, depth, path, hit) {
    if (depth > 4 || !node || hit.done) return;
    if (typeof node === 'string') {
      if (looksToken(node) && /token|auth|login|session|user/i.test(path)) {
        hit.done = true;
        hit.value = node;
      }
      return;
    }
    if (Array.isArray(node)) {
      for (var i = 0; i < node.length && i < 40; i++) deepScan(node[i], depth + 1, path, hit);
      return;
    }
    if (typeof node === 'object') {
      var keys = Object.keys(node);
      for (var k = 0; k < keys.length && k < 40; k++) {
        deepScan(node[keys[k]], depth + 1, path + '.' + keys[k], hit);
        if (hit.done) return;
      }
    }
  }
  function scanIdb() {
    if (!window.indexedDB || !indexedDB.databases) return;
    Promise.resolve(indexedDB.databases()).then(function (list) {
      (list || []).forEach(function (info) {
        if (!info || !info.name) return;
        try {
          var req = indexedDB.open(info.name);
          req.onerror = function () {};
          req.onblocked = function () {};
          req.onsuccess = function () {
            var db = req.result;
            var names = Array.prototype.slice.call(db.objectStoreNames || []);
            if (!names.length) { try { db.close(); } catch (e) {} return; }
            try {
              var tx = db.transaction(names, 'readonly');
              tx.oncomplete = function () { try { db.close(); } catch (e) {} };
              names.forEach(function (n) {
                try {
                  var all = tx.objectStore(n).getAll();
                  all.onsuccess = function () {
                    var hit = { done: false, value: '' };
                    deepScan(all.result, 0, info.name + '/' + n, hit);
                    if (hit.done) report(hit.value, 'IndexedDB');
                  };
                } catch (e) {}
              });
            } catch (e) { try { db.close(); } catch (_e) {} }
          };
        } catch (e) {}
      });
    }).catch(function () {});
  }

  /* ---------- 4. 诊断：抓不到时把页面存储清单回传，便于排查 ---------- */
  function diag(reason) {
    var d = { reason: reason, path: location.pathname, ua: navigator.userAgent.slice(0, 80), storage: [], cookie: [], idb: [] };
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i) || '';
        d.storage.push(k + '=' + String(localStorage.getItem(k) || '').slice(0, 80));
      }
    } catch (e) {}
    try {
      var parts = (document.cookie || '').split(';');
      for (var j = 0; j < parts.length; j++) {
        var eq = parts[j].indexOf('=');
        if (eq > 0) d.cookie.push(parts[j].slice(0, eq).trim());
      }
    } catch (e) {}
    if (window.indexedDB && indexedDB.databases) {
      try {
        Promise.resolve(indexedDB.databases()).then(function (list) {
          d.idb = (list || []).map(function (x) { return x && x.name; });
          sendDiag(d);
        }).catch(function () { sendDiag(d); });
        return;
      } catch (e) {}
    }
    sendDiag(d);
  }
  function sendDiag(d) {
    try {
      fetch(REPORT, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ diag: d, sid: sidCookie() })
      }).catch(function () {});
    } catch (e) {}
  }

  /* ---------- UI ---------- */
  function status() {
    var el = document.getElementById('__dsweb_status');
    if (!el) {
      el = document.createElement('div');
      el.id = '__dsweb_status';
      el.style.cssText = 'position:fixed;left:6px;top:6px;z-index:2147483647;font:11px monospace;background:rgba(0,0,0,.8);color:#7bd88f;padding:6px 8px;border-radius:6px;max-width:92vw;white-space:pre-wrap';
      document.body.appendChild(el);
    }
    var root = document.getElementById('root');
    el.textContent = 'ds-web [' + REGION + '] | ' + document.readyState + ' | 已载=' + (window.__dsLoaded || 0) +
      ' 失败=' + (window.__dsErr || 0) + (window.__dsErrSrc ? ' [' + String(window.__dsErrSrc).split('/').pop() + ']' : '') +
      ' | root子=' + (root ? root.children.length : -1) + ' | ' + location.pathname;
  }
  function tip(msg) {
    try { console.log('[dsweb]', msg); } catch (e) {}
    var el = document.getElementById('__dsweb_tip');
    if (!el) {
      el = document.createElement('div');
      el.id = '__dsweb_tip';
      el.style.cssText = 'position:fixed;left:8px;bottom:8px;right:8px;z-index:99998;font:12px monospace;background:rgba(0,0,0,.82);color:#ffd479;padding:8px;border-radius:8px;max-height:35vh;overflow:auto;white-space:pre-wrap';
      document.body.appendChild(el);
    }
    el.textContent = String(msg);
  }

  // 让浏览器的密码管理器能识别登录表单
  function tagLoginForm() {
    var pass = document.querySelector('input[type=password]');
    if (!pass) return;
    if (pass.getAttribute('autocomplete') !== 'current-password') {
      pass.setAttribute('autocomplete', 'current-password');
      pass.setAttribute('name', 'password');
      pass.setAttribute('id', pass.id || 'dsweb-password');
    }
    var scope = pass.closest('form') || document.body;
    var user = scope.querySelector('input[type=email], input[type=tel], input[type=text]');
    if (user && user !== pass && user.getAttribute('autocomplete') !== 'username') {
      user.setAttribute('autocomplete', 'username');
      user.setAttribute('name', 'username');
      user.setAttribute('id', user.id || 'dsweb-username');
    }
  }

  // 手动兜底：点一下就把当前页面里能找到的 token 全部试一遍
  function manualScan() {
    tip('正在从 localStorage / Cookie / IndexedDB 查找 token…');
    var found = scanStorage();
    scanIdb();
    setTimeout(function () {
      if (!found) {
        var any = false;
        for (var t in sent) { if (sent[t]) any = true; }
        if (!any) tip('没找到 token。若你还没登录，请先在这个页面登录；若已登录仍不行，请把下面这行发给作者：\\n已登录但未找到 token，路径 ' + location.pathname);
      }
    }, 2500);
  }
  window.__dswebScan = manualScan;

  document.addEventListener('DOMContentLoaded', function () {
    status(); tagLoginForm();
    scanStorage();
  });
  var _err = console.error;
  console.error = function () {
    try { tip('console.error: ' + Array.prototype.map.call(arguments, function (a) { return a && a.message ? a.message : String(a); }).join(' ')); } catch (e) {}
    return _err.apply(console, arguments);
  };
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && (t.src || t.href)) tip('资源加载失败: ' + (t.src || t.href));
    else tip('JS 错误: ' + (e.message || '') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    tip('Promise 失败: ' + (e.reason && (e.reason.message || e.reason)));
  });

  /* ---------- 内嵌模式：别让登录页跳出 iframe ---------- */
  // 站点有些链接是 target=_blank（注册 / 找回密码 / 第三方授权），在 iframe 里点了会被拦，
  // 直接改成当前窗口跳转，用户不至于卡住。
  if (IN_FRAME) {
    document.addEventListener('click', function (e) {
      var el = e.target;
      while (el && el !== document) {
        if (el.tagName === 'A' && (el.target === '_blank' || el.target === '_new')) { el.target = '_self'; break; }
        el = el.parentNode;
      }
    }, true);
    var __dswebOpen = window.open;
    window.open = function (url) {
      try { if (url && typeof url === 'string') { location.href = url; return null; } } catch (e) {}
      return __dswebOpen.apply(window, arguments);
    };
  }

  setInterval(status, 1500);
  setInterval(tagLoginForm, 1500);
  setInterval(function () { scanStorage(); }, 2000);
  setTimeout(function () { scanStorage(); scanIdb(); }, 1500);
  setTimeout(function () { scanStorage(); scanIdb(); }, 6000);
  setTimeout(function () {
    var none = true;
    for (var t in sent) { if (sent[t]) none = false; }
    if (none) diag('no-token-after-12s');
  }, 12000);
})();
</script>
<div id="__dsweb_tip" style="position:fixed;left:8px;bottom:8px;z-index:99999;font:12px sans-serif;background:rgba(0,0,0,.75);color:#fff;padding:6px 10px;border-radius:8px;pointer-events:none">登录后会自动保存到 DSH，无需复制 token</div>
<div style="position:fixed;right:8px;top:64px;z-index:99999;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
  <a id="__dsweb_signup" href="/sign_up" style="font:12px sans-serif;background:rgba(80,140,255,.22);color:#cfe0ff;border:1px solid rgba(120,170,255,.5);padding:6px 10px;border-radius:8px;text-decoration:none">没有账号？邮箱注册</a>
  <button id="__dsweb_scan" onclick="window.__dswebScan&&window.__dswebScan()" style="font:12px sans-serif;background:rgba(80,200,140,.22);color:#c6f5d8;border:1px solid rgba(90,220,160,.55);padding:6px 10px;border-radius:8px">提取并保存 token</button>
  <button onclick="(function(){try{localStorage.clear();sessionStorage.clear();}catch(e){};alert('已退出本页登录（插件里的 token 不受影响）');location.href='/sign_in';})()" style="font:12px sans-serif;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:8px">退出本页登录</button>
</div>
<script>
(function () {
  var hint = null;
  function syncAuthUi() {
    try {
      var onSignUp = location.pathname.indexOf('/sign_up') === 0;
      var a = document.getElementById('__dsweb_signup');
      if (a) a.style.display = onSignUp ? 'none' : '';
      if (onSignUp && !hint) {
        hint = document.createElement('div');
        hint.style.cssText = 'position:fixed;left:8px;top:64px;right:120px;z-index:99997;font:12px sans-serif;background:rgba(255,180,60,.14);color:#ffd479;border:1px solid rgba(255,180,60,.45);padding:8px 10px;border-radius:8px;line-height:1.6';
        hint.innerHTML = '注册按钮一直转圈？多半是站点人机验证无法在本地反代域名下完成。<br>' +
          '请点「返回登录」，用 <b>邮箱验证码</b> 登录：第一次登录会自动创建账号，效果与注册相同。';
        document.body.appendChild(hint);
      } else if (!onSignUp && hint) {
        hint.remove();
        hint = null;
      }
    } catch (e) {}
  }
  syncAuthUi();
  window.addEventListener('popstate', syncAuthUi);
  setInterval(syncAuthUi, 1200);
})();
</script>
<script>
/*
 * 浏览器自动登录：插件点「浏览器登录」时会在 URL 上带一张短时效票据（__dsweb_auto=…）。
 * 本脚本凭票据向本机登录代理取回账号密码，自动填进站点登录表单并提交。
 * 站点自己完成风控/PoW/验证码流程，所以这条路不会被 RISK_DEVICE_DETECTED 拦住。
 * 注意：验证码（邮箱 6 位码）没法自动填，需要用户在这一页手动输入。
 */
(function () {
  var KEY = 'dsweb_auto_ticket';
  var ticket = '';
  try {
    var m = /[?&]__dsweb_auto=([a-f0-9]{8,64})/i.exec(location.search || '');
    if (m) {
      ticket = m[1];
      try { sessionStorage.setItem(KEY, ticket); } catch (e) {}
    } else {
      ticket = sessionStorage.getItem(KEY) || '';
    }
  } catch (e) {}
  if (!ticket) return;
  var path = location.pathname || '/';
  if (path.indexOf('/sign_in') !== 0 && path !== '/' && path.indexOf('/sign_up') !== 0) return;

  var info = null;
  var filling = false;
  var submits = 0;
  var lastSubmit = 0;
  var startedAt = Date.now();

  function tip(msg) {
    try { console.log('[dsweb-auto]', msg); } catch (e) {}
    var el = document.getElementById('__dsweb_tip');
    if (!el) {
      el = document.createElement('div');
      el.id = '__dsweb_tip';
      el.style.cssText = 'position:fixed;left:8px;bottom:8px;right:8px;z-index:99998;font:12px monospace;background:rgba(0,0,0,.82);color:#ffd479;padding:8px;border-radius:8px;max-height:35vh;overflow:auto;white-space:pre-wrap';
      document.body.appendChild(el);
    }
    el.textContent = String(msg);
  }

  function visible(el) {
    if (!el) return false;
    var r = el.getBoundingClientRect();
    return r.width > 2 && r.height > 2;
  }
  function emailInput() {
    var list = document.querySelectorAll('input[type=email], input[name=email], input[autocomplete=username], input[placeholder]');
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (!visible(el) || el.type === 'password') continue;
      var ph = String(el.placeholder || '') + ' ' + String(el.name || '') + ' ' + String(el.type || '');
      if (/邮箱|email|账号|account|用户名/i.test(ph)) return el;
    }
    var any = document.querySelector('input[type=email]');
    return visible(any) ? any : null;
  }
  function passwordInput() {
    var list = document.querySelectorAll('input[type=password]');
    for (var i = 0; i < list.length; i++) if (visible(list[i])) return list[i];
    return null;
  }
  function setVal(el, value) {
    var proto = Object.getPrototypeOf(el);
    var desc = Object.getOwnPropertyDescriptor(proto, 'value') || Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    if (desc && desc.set) desc.set.call(el, value);
    else el.value = value;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function findByText(re) {
    var nodes = document.querySelectorAll('button, [role=button], a, div');
    for (var i = 0; i < nodes.length; i++) {
      var t = String(nodes[i].textContent || '').trim();
      if (!t || t.length > 12) continue;
      if (re.test(t) && visible(nodes[i])) return nodes[i];
    }
    return null;
  }
  function submitForm(pass) {
    var form = pass && pass.closest && pass.closest('form');
    if (form && form.requestSubmit) { form.requestSubmit(); return true; }
    var btn = findByText(/^(登录|登 录|立即登录|Log ?in|Sign ?in)$/i);
    if (btn) { btn.click(); return true; }
    if (pass) {
      ['keydown', 'keypress', 'keyup'].forEach(function (type) {
        pass.dispatchEvent(new KeyboardEvent(type, { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true }));
      });
      return true;
    }
    return false;
  }

  fetch('/__dsweb/prefill?t=' + encodeURIComponent(ticket), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) {
        tip('自动登录票据无效：' + ((d && d.message) || '请回到插件重新点「浏览器登录」'));
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        return;
      }
      info = d;
      try { window.__dswebAccountId = d.accountId || ''; } catch (e) {}
      tip('已取到保存的账号，正在自动填入…');
      fillLoop();
    })
    .catch(function (e) {
      tip('取账号失败：' + (e && e.message ? e.message : e));
    });

  function fillLoop() {
    if (!info || filling) return;
    var emailEl = emailInput();
    var passEl = passwordInput();
    if (!passEl && Date.now() - startedAt > 2500) {
      var tab = findByText(/密码登录|密码|Password|Use password/i);
      if (tab && tab.getAttribute('data-dsweb-tab') !== '1') {
        tab.setAttribute('data-dsweb-tab', '1');
        tab.click();
      }
    }
    filling = true;
    try {
      if (emailEl && info.email && emailEl.value !== info.email) setVal(emailEl, info.email);
      if (passEl && info.password && passEl.value !== info.password) setVal(passEl, info.password);
    } finally {
      filling = false;
    }
    // 填完了就提交；如果站点还没渲染完，下一轮继续
    if (emailEl && passEl && info.password && info.email && submits < 3 && Date.now() - lastSubmit > 5000) {
      if (submitForm(passEl)) {
        submits += 1;
        lastSubmit = Date.now();
        tip('已自动填入并提交（第 ' + submits + ' 次），等待站点登录结果…');
      }
    }
    if (Date.now() - startedAt > 40000) {
      tip('自动填写已停止。若还停在登录页，请检查密码或点「登录」按钮；需要验证码时请输入邮箱验证码。');
      return;
    }
    setTimeout(fillLoop, 500);
  }
})();
</script>
