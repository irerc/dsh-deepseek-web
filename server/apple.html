<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>使用 Apple 账号登录 DeepSeek</title>
<style>
  :root { color-scheme: dark }
  body { margin:0; padding:24px 18px; background:#111318; color:#e8eaf0; font:14px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif }
  h1 { font-size:18px; margin:0 0 4px }
  p.sub { color:#9aa1ad; margin:0 0 18px; font-size:13px }
  button { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #3b4250; background:#1b1f27; color:#e8eaf0; font-size:15px; cursor:pointer }
  button#go { background:#fff; color:#111; font-weight:600; border:none; display:flex; align-items:center; justify-content:center; gap:8px }
  button:disabled { opacity:.55 }
  #status { margin-top:16px; font-size:13px; white-space:pre-wrap; color:#ffd479 }
  #status.ok { color:#7bd88f }
  #status.err { color:#ff7b72 }
  .card { border:1px solid #2a2f3a; border-radius:12px; padding:16px; background:#161a21 }
  .hint { color:#8b93a1; font-size:12px; margin-top:14px }
</style>
</head>
<body>
  <div class="card">
    <h1>使用 Apple 账号登录</h1>
    <p class="sub">在这里完成 Apple 授权后，token 会直接保存到 DSH 插件的账号池。</p>
    <button id="go" type="button"> 使用 Apple 账号登录</button>
    <div id="status"></div>
    <p class="hint">第一次用 Apple 登录的新账号，站点可能要求绑定一个手机号（这一步只能在 DeepSeek 页面里完成）；插件会如实提示。</p>
  </div>
<script>
(function () {
  var CLIENT_ID = 'com.deepseek.chat-web-prod';
  var REDIRECT_URI = 'https://chat.deepseek.com/oauth_apple_callback';
  var SDK = 'https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/zh_CN/appleid.auth.js';
  var go = document.getElementById('go');
  var statusEl = document.getElementById('status');
  var sdkReady = null;

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = kind || '';
  }
  function rand(n) {
    var s = '';
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    for (var i = 0; i < (n || 24); i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return s;
  }
  function loadSdk() {
    if (sdkReady) return sdkReady;
    sdkReady = new Promise(function (resolve, reject) {
      if (window.AppleID && window.AppleID.auth) return resolve();
      var s = document.createElement('script');
      s.src = SDK;
      s.onload = function () {
        if (!window.AppleID || !window.AppleID.auth) return reject(new Error('Apple 登录脚本加载后不可用'));
        try {
          window.AppleID.auth.init({
            clientId: CLIENT_ID,
            scope: 'name email',
            redirectURI: REDIRECT_URI,
            usePopup: true,
            locale: 'zh_CN',
          });
          resolve();
        } catch (e) { reject(e); }
      };
      s.onerror = function () { reject(new Error('Apple 登录脚本加载失败（可能被网络拦截）')); };
      document.head.appendChild(s);
    });
    return sdkReady;
  }

  go.addEventListener('click', function () {
    go.disabled = true;
    setStatus('正在打开 Apple 登录窗口…');
    loadSdk()
      .then(function () {
        var state = rand(24);
        var nonce = rand(24);
        return window.AppleID.auth.signIn({ state: state, nonce: nonce }).then(function (res) {
          var auth = res && res.authorization;
          if (!auth || !auth.id_token) throw new Error('Apple 没有返回凭证');
          if (auth.state && auth.state !== state) throw new Error('状态校验失败，请重试');
          setStatus('Apple 授权成功，正在换取 DeepSeek 登录态…');
          return fetch('/dsh-deepseek-web/login/apple', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ idToken: auth.id_token, label: 'Apple 登录' }),
          }).then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.ok) {
              setStatus('已保存到 DSH 插件 ✓' + (d.account && d.account.email ? '\n账号：' + d.account.email : '') + (d.muted ? '\n注意：' + d.message : '') + '\n可以关闭本页了', 'ok');
              go.textContent = '已保存 ✓';
              return;
            }
            setStatus('登录没有完成：' + ((d && d.message) || '未知原因'), 'err');
            go.disabled = false;
          });
        });
      })
      .catch(function (e) {
        var msg = e && (e.message || e.error) || String(e);
        if (/popup_closed_by_user/i.test(msg)) msg = '你关闭了 Apple 登录窗口，可以再点一次';
        else if (/popup_blocked_by_browser/i.test(msg)) msg = '浏览器拦截了弹窗，请允许弹窗后重试';
        setStatus(msg, 'err');
        go.disabled = false;
      });
  });
})();
</script>
</body>
</html>
